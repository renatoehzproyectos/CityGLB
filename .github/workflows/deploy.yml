name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Detect output directory
        id: outdir
        run: |
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "path=./dist" >> "$GITHUB_OUTPUT"
          elif [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
            echo "path=./.output/public" >> "$GITHUB_OUTPUT"
          elif [ -d ".vercel/output/static" ] && [ -f ".vercel/output/static/index.html" ]; then
            echo "path=./.vercel/output/static" >> "$GITHUB_OUTPUT"
          else
            echo "No se encontró carpeta de salida esperada (dist, .output/public o .vercel/output/static)."
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.outdir.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
